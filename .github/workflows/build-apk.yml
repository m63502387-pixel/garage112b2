name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot and Android
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/godot/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          echo '[gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true' > ~/.config/godot/editor_settings-4.3.tres
      - name: Import and export APK
        run: |
          mkdir -v -p build
          godot --headless --import || true
          godot --headless --export-debug "Android" build/garage112.apk
      - uses: actions/upload-artifact@v4
        with:
          name: garage112-apk
          path: build/garage112.apk
